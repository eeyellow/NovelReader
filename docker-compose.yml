services:
  novel-reader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novel-reader
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - PORT=3000
    volumes:
      # Mount persistent SQLite database and uploaded novel files
      - ./data:/app/data
